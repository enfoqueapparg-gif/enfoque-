<style>

#app{display:grid;grid-template-columns:15rem 1fr;min-height:100vh}

.ni[aria-current=page]{background:var(--ink);color:var(--bg);font-weight:700}
#v{padding:1.5rem;max-width:64rem;width:100%;margin:auto}
h1{font-size:1.8rem;margin:.1rem 0 1rem;line-height:1.2}h2{font-size:1.2rem;margin:1.6rem 0 .7rem}
.card{background:var(--s1);border:1px solid var(--s2);border-radius:var(--r);padding:1rem}

.row{display:flex;gap:.8rem;align-items:center}.grow{flex:1;min-width:0}.mut{color:var(--mut);font-size:.9rem}.wrap{flex-wrap:wrap}
.hs{display:flex;gap:.8rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.6rem}.hs>*{flex:0 0 auto;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.9rem}
.av{width:2.6rem;height:2.6rem;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;object-fit:cover;flex:none}
.badge{background:var(--acc);color:var(--onacc);border-radius:99px;padding:.05rem .55rem;font-size:.85rem;font-weight:700}
.item{display:flex;gap:.8rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--s2);padding:.8rem .2rem;cursor:pointer}
.w{width:15rem;text-align:left;cursor:pointer}
.ph{height:9rem;border-radius:8px;background:linear-gradient(135deg,var(--s2),var(--accs));display:grid;place-items:center;color:var(--mut);overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.ic{flex:none}.liked .ic{fill:currentColor}
.chat{display:flex;flex-direction:column;height:calc(100vh - 3rem)}

.mapw{position:relative;height:calc(100vh - 17rem);min-height:20rem;border-radius:var(--r);overflow:hidden;border:2px solid var(--s2);touch-action:none;cursor:grab}
.mi{position:absolute;inset:0;transition:transform .4s}.mi svg{width:100%;height:100%}
.m1{fill:var(--s1)}.m2{stroke:var(--s2);fill:none}.m3{fill:var(--accs)}.m4{fill:var(--s2)}

.mk.pl{border-radius:8px;background:var(--bg);color:var(--ink);border-color:var(--ink)}.mk.me{background:var(--acc);color:var(--onacc);box-shadow:0 0 0 .5rem var(--accs)}.mk[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:3px}

.fab{position:fixed;right:1.2rem;bottom:1.2rem;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--fc);color:#fff;border:3px solid var(--bg);box-shadow:0 4px 18px #0005;cursor:pointer;display:grid;place-items:center;z-index:30}
.fw{position:fixed;right:1.2rem;bottom:5.5rem;width:min(24rem,calc(100vw - 2rem));height:min(33rem,72vh);background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);display:none;flex-direction:column;z-index:30;overflow:hidden}.fw.open{display:flex}
.fw header{padding:.7rem .9rem;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:.5rem}.fw .msgs{padding:.7rem}.fw .row{padding:.6rem}
.sv{position:fixed;inset:0;background:#000;color:#fff;z-index:50;display:flex;flex-direction:column;padding:1rem}
.bar{height:5px;background:#555;border-radius:3px}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;animation:fill 5s linear forwards}@keyframes fill{to{width:100%}}
.sc{flex:1;display:grid;place-items:center;text-align:center;font-size:1.6rem;padding:1.5rem;border-radius:var(--r);margin:1rem 0;background-size:cover;background-position:center}
.md{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:60}.mc{width:min(26rem,92vw);background:var(--bg);border-radius:var(--r);padding:1.2rem;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:var(--r);z-index:70}
.sw{display:flex;align-items:center;gap:.8rem;justify-content:space-between;min-height:3rem;border-bottom:1px solid var(--s2)}.sw input{width:1.6rem;min-height:1.6rem;accent-color:var(--acc)}
details{border-bottom:1px solid var(--s2);padding:.6rem 0}summary{cursor:pointer;font-weight:700}
[data-big] .btn,[data-big] .ni,[data-big] input,[data-big] .chip{min-height:3.6rem;font-size:1.1rem}
[data-rm] *{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:760px){
#app{grid-template-columns:1fr}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;padding:.3rem;background:var(--bg);z-index:20;border-right:0;border-top:1px solid var(--s2)}
.logo{display:none}.ni{flex-direction:column;gap:.1rem;min-height:3.6rem;padding:0 .7rem;font-size:.72rem;flex:none}
#v{padding:1rem 1rem 6rem}.chat{height:calc(100vh - 7.5rem)}.fab{bottom:5.2rem}.fw{bottom:9.5rem}.mapw{height:calc(100vh - 20rem)}}

<style id="focus-floating-demo">
/* Burbuja flotante Focus: versión demostrativa */
#fab.fab{
  position:fixed; z-index:100;
  right:1.15rem; bottom:1.35rem;

}

<h2>Soporte técnico</h2><details><summary>¿Cómo agrando el texto?</summary><p>Ajustes › Accesibilidad › Tamaño de texto.</p></details><details><summary>¿Cómo uso Focus?</summary><p>Tocá la burbuja y escribí o hablá.</p></details><button class="btn" style="margin-top:.8rem" data-a="sp">Contactar soporte</button>`}};

/* ===== Render y navegación ===== */
function apply(){const d=document.documentElement;d.dataset.t=S.t;d.style.setProperty('--fs',S.fs);d.style.setProperty('--fc',S.fc);d.toggleAttribute('data-hc',!!S.hc);d.toggleAttribute('data-big',!!S.big);d.toggleAttribute('data-rm',!!S.rm)}
function render(){
 apply();
 const groups=[
  ['PRINCIPAL',['home']],
  ['COMUNICACIÓN',['chat','st']],
  ['COMUNIDAD',['post','com','lrn']],
  ['TU ESPACIO',['map','me']],
  ['CONFIGURACIÓN',['set']]
 ];
 const byId=Object.fromEntries(N.map(n=>[n[0],n]));
 $('#nav').innerHTML=`<div class="logo">${LOGO}<div><b>Enfoque</b><small>TECNOLOGÍA QUE TE ACOMPAÑA</small></div></div>
 <div class="nav-scroll">${groups.map(([label,ids])=>`<section class="nav-group"><div class="nav-label">${label}</div>${ids.map(id=>{const n=byId[id];return `<button class="ni" data-a="go" data-i="${n[0]}" ${S.tab==n[0]?'aria-current="page"':''}>${ic(n[2])}<span>${n[1]}</span>${S.tab==n[0]?'<i class="nav-active-dot"></i>':''}</button>`}).join('')}</section>`).join('')}</div>
 <button class="nav-profile" data-a="go" data-i="me">${av(me(),'2.35rem')}<span><b>${E(S.name)}</b><small>Ver mi perfil</small></span><span class="nav-more">···</span></button>`;
 $('#v').innerHTML=V[S.tab]();
 const m=$('#ms');if(m)m.scrollTop=m.scrollHeight;
 $('#fab').innerHTML='<span aria-hidden="true" style="font-size:1.65rem;font-weight:800;line-height:1">✦</span>';
}
function go(t){S.tab=t;S.cc=S.cm=S.tp=null;q='';cat='Todos';save();render();$('#v').focus()}
const chatById=()=>S.chats.find(c=>c.id==S.cc);
function reply(c){setTimeout(()=>{c.m.push({s:'in',a:c.g?'Eva Luna':undefined,t:['Recibido, gracias','Me parece bien','Contame más'][Math.random()*3|0],h:tm()});save();if(S.tab=='chat'&&S.cc==c.id)render()},1000)}

/* ===== Acciones (delegación de eventos) ===== */
const A={go:i=>go(i),mx:(i,t,e)=>{if(e.target==t)$('#ov').innerHTML=''},mc:()=>$('#ov').innerHTML='',
qe:()=>{S.qe=!S.qe;render()},qt:i=>{S.quick=S.quick.includes(i)?S.quick.filter(x=>x!=i):[...S.quick,i];save();render()},
oc:i=>{S.tab='chat';S.cc=+i;const c=chatById();c.u=0;save();render()},cb:()=>{S.cc=null;render()},ci:()=>{S.info=!S.info;render()},
nn:()=>ask('Nueva conversación',[['n','Nombre de la persona','text']],d=>{if(d.n.trim()){S.chats.unshift({id:Date.now(),n:d.n.trim(),g:0,u:0,m:[]});save();render()}},'Crear'),
nc:i=>{S.chats.unshift({id:Date.now(),n:i,g:0,u:0,m:[]});q='';save();render()},
ng:()=>ask('Nuevo grupo',[['n','Nombre del grupo','text']],d=>{if(d.n.trim()){S.chats.unshift({id:Date.now(),n:d.n.trim(),g:1,u:0,m:[]});save();render()}},'Crear grupo'),
ca:()=>pick(600,s=>{const c=chatById();c.m.push({s:'out',k:'img',src:s,h:tm()});save();render()}),cl:()=>{const c=chatById();c.m.push({s:'out',k:'loc',h:tm()});save();render();toast('Ubicación compartida');reply(c)},
ns:()=>ask('Publicar estado',[['t','Texto del estado','area']],d=>{const f=s=>{S.stories.unshift({u:'me',t:d.t,bg:Math.random()*3|0,img:s,h:'Ahora'});save();render()};confirm('¿Agregar una imagen?')?pick(700,f):f(null)}),
sv:i=>{svi=+i;showStory()},
pa:()=>pick(700,s=>{S.pimg=s;const t=$('#pt').value;render();$('#pt').value=t;toast('Imagen lista')}),pp:()=>{const t=$('#pt').value.trim();if(!t&&!S.pimg)return toast('Escribí algo para publicar');S.posts.unshift({id:Date.now(),a:'me',d:'Ahora',t,img:S.pimg||null,l:0,liked:0,c:[]});S.pimg=null;save();render();toast('Publicado')},
lk:i=>{const p=S.posts.find(x=>x.id==i);p.liked=!p.liked;p.l+=p.liked?1:-1;save();render()},cm:i=>{const p=S.posts.find(x=>x.id==i);p.open=!p.open;render()},
cc:i=>ask('Comentar',[['t','Tu comentario','area']],d=>{if(d.t.trim()){S.posts.find(x=>x.id==i).c.push([S.name,d.t]);save();render()}},'Comentar'),
sh:i=>{const p=S.posts.find(x=>x.id==i);if(navigator.share)navigator.share({text:p.t}).catch(()=>{});else{navigator.clipboard?.writeText(p.t);toast('Texto copiado para compartir')}},
cn:()=>ask('Crear comunidad',[['n','Nombre','text'],['d','Descripción','area']],d=>{if(d.n.trim()){S.comms.unshift({id:Date.now(),n:d.n.trim(),top:cat=='Todos'?'Lectura':cat,mem:1,j:1,d:d.d,posts:[],msgs:[]});save();render()}},'Crear'),
cj:i=>{const c=S.comms.find(x=>x.id==i);c.j=c.j?0:1;save();render();toast(c.j?'Te uniste':'Saliste de la comunidad')},cv:i=>{S.cm=+i;render()},cx:()=>{S.cm=null;render()},
ct:i=>{cat=i;render()},
tn:()=>ask('Crear tema',[['t','Título','text'],['q','Tu pregunta','area']],d=>{if(d.t.trim()){S.topics.unshift({id:Date.now(),t:d.t.trim(),cat:cat=='Todos'?'Lectura':cat,j:1,q:d.q,a:[]});save();render()}},'Crear'),
tj:i=>{const t=S.topics.find(x=>x.id==i);t.j=t.j?0:1;save();render();toast(t.j?'Participás en este tema':'Saliste del tema')},tv:i=>{S.tp=+i;render()},tx:()=>{S.tp=null;render()},
mp:i=>{sel=i;render()},mc2:()=>{pan={x:0,y:0};sel=null;$('#mi').style.transform='';toast('Mapa centrado')},
pf:()=>pick(200,s=>{S.photo=s;save();render()}),pv:()=>{S.pv=!S.pv;render()},
pe:()=>ask('Editar perfil',[['name','Nombre','text',S.name],['user','Nombre de usuario','text',S.user],['bio','Biografía','area',S.bio],['city','Ciudad','text',S.city]],d=>{Object.assign(S,{name:d.name||S.name,user:d.user,bio:d.bio,city:d.city});save();render()}),
th:i=>{S.t=i;save();render()},ub:i=>{S.blocked=S.blocked.filter(b=>b!=i);save();render()},sp:()=>ask('Contactar soporte',[['m','Contanos qué pasa','area']],()=>toast('Mensaje enviado (demostración)'),'Enviar')};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.i,t,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.in){q=t.value;$('#ls').innerHTML=LS[t.dataset.in]()}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.c;if(!k)return;const v=t.type=='checkbox'?+t.checked:t.type=='range'?+t.value:t.value,p=k.split('.');if(p.length>1)S[p[0]][p[1]]=v;else S[k]=v;save();render()});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const t=new FormData(e.target).get('t').trim();if(!t)return;
if(f=='msg'){const c=chatById();c.m.push({s:'out',t,h:tm()});save();render();reply(c)}
if(f=='cmsg'){S.comms.find(x=>x.id==S.cm).msgs.push({a:S.name,t});save();render()}
if(f=='ans'){S.topics.find(x=>x.id==S.tp).a.push({a:'me',t});S.topics.find(x=>x.id==S.tp).j=1;save();render()}});
let drag=null;
document.addEventListener('pointerdown',e=>{if(e.target.closest('#mw')&&!e.target.closest('button,input'))drag={x:e.clientX-pan.x,y:e.clientY-pan.y}});
document.addEventListener('pointermove',e=>{if(drag){pan={x:e.clientX-drag.x,y:e.clientY-drag.y};$('#mi').style.transition='none';$('#mi').style.transform=`translate(${pan.x}px,${pan.y}px)`}});
document.addEventListener('pointerup',()=>{drag=null;const m=$('#mi');if(m)m.style.transition=''});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){$('#ov').innerHTML='';closeStory();$('#fw').classList.remove('open')}});

/* ===== Estados a pantalla completa ===== */
function showStory(){clearTimeout(svt);const s=S.stories[svi];if(!s)return closeStory();$('#ov').innerHTML=`<div class="sv" role="dialog" aria-modal="true" aria-label="Estado de ${E(s.u)}"><div class="bar"><i></i></div><div class="row" style="margin-top:.8rem">${av(s.u)}<b class="grow">${E(s.u=='me'?S.name:s.u)} <span style="opacity:.7">${s.h}</span></b><button class="btn i" id="sx" aria-label="Cerrar estado">${ic('x')}</button></div><div class="sc" style="background-image:${s.img?`url(${s.img})`:BG[s.bg%3]}"><span style="background:#0009;padding:.6rem;border-radius:12px">${E(s.t)}</span></div><div class="row"><button class="btn" id="sp">Anterior</button><span class="grow"></span><button class="btn" id="sn">Siguiente</button></div></div>`;$('#sx').onclick=closeStory;$('#sn').onclick=()=>{svi++;showStory()};$('#sp').onclick=()=>{svi=Math.max(0,svi-1);showStory()};$('#sn').focus();svt=setTimeout(()=>{svi++;showStory()},5000)}
function closeStory(){clearTimeout(svt);if($('.sv'))$('#ov').innerHTML=''}

/* ===== Focus: IA de Enfoque (respuestas de demostración) ===== */
function focusUI(){$('#fw').innerHTML=`<header><b class="grow">Focus <small style="display:block;font-size:.68rem;font-weight:400;opacity:.8">Asistente de demostración</small></b><button class="btn i" style="min-height:2.2rem;width:2.2rem" data-fa="x" aria-label="Cerrar Focus">${ic('x',18)}</button></header><div class="msgs" aria-live="polite" id="fms">${S.fm.map(m=>`<div class="msg ${m.s}">${E(m.t)}</div>`).join('')}</div><div class="row wrap" style="padding:0 .6rem">${['Ayuda','Leer pantalla','Ir al mapa'].map(t=>`<button class="chip" data-fa="q" data-t="${t}">${t}</button>`).join('')}</div><form class="row" id="ff"><button class="btn i" type="button" data-fa="mic" aria-label="Hablar con Focus">${ic('mic')}</button><input name="t" aria-label="Mensaje para Focus" placeholder="Escribile a Focus" autocomplete="off"><button class="btn p i" aria-label="Enviar">${ic('send')}</button></form>`;const m=$('#fms');m.scrollTop=m.scrollHeight;$('#ff').onsubmit=e=>{e.preventDefault();const i=$('#ff input');fsend(i.value);}}
function fsend(t){t=t.trim();if(!t)return;S.fm.push({s:'out',t});let r='Soy Focus, el asistente de demostración de Enfoque. Por ahora puedo orientarte dentro de esta vista.';const l=t.toLowerCase();if(l.includes('mapa')){go('map');r='Te llevé al mapa.'}else if(l.includes('pantalla')||l.includes('leer'))r='Estás en la sección '+N.find(n=>n[0]==S.tab)[1]+'. Podés activar la lectura en voz alta en Ajustes.';else if(l.includes('ayuda'))r='Probá: “ir al mapa”, “leer pantalla”, o abrí Ajustes para aumentar el texto.';else if(l.includes('chat'))r='Abrí Chats para ver tus conversaciones.';S.fm.push({s:'in',t:r});S.fm=S.fm.slice(-30);save();focusUI();if(S.tts&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(r))}
$('#fab').onclick=()=>{const w=$('#fw');w.classList.toggle('open');if(w.classList.contains('open')){focusUI();$('#ff input').focus()}};
$('#fw').addEventListener('click',e=>{const b=e.target.closest('[data-fa]');if(!b)return;const a=b.dataset.fa;if(a=='x')$('#fw').classList.remove('open');if(a=='q')fsend(b.dataset.t);if(a=='mic'){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Tu navegador no permite dictado: escribí tu mensaje');const r=new R();r.lang='es-AR';r.onresult=ev=>fsend(ev.results[0][0].transcript);r.start();toast('Escuchando…')}});
render();
</script>
</body>
</html>
